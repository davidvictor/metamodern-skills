<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/fixture/components/bundle.css">
<script src="ds/fixture/components/bundle.js"></script>
<link rel="stylesheet" href="ds/fixture/components/scenes.css">
<script src="ds/fixture/components/scenes.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:24px}</style>
</helmet>
<div class="scenes" data-canvas-id="scenes">
  <x-import component-from-global-scope="Fixture.Scene" id="overview" state="{{overview}}" theme="{{theme}}"></x-import>
  <x-import component-from-global-scope="Fixture.Scenes.Settings" theme="{{theme}}" input-context="touch"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"overview":{"editor":"enum","options":["filled","empty"],"default":"filled"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', overview: this.props.overview ?? 'filled' };
  }
}
</script>
</body>
</html>
