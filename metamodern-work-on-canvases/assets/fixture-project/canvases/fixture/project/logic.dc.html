<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board logic</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="skin.css">
<link rel="stylesheet" href="ds/fixture/components/bundle.css">
<script src="ds/fixture/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<x-import component-from-global-scope="Fixture.Root" theme="{{theme}}">
<div class="board" data-canvas-id="logic">
  <h1 class="board-title">Step {{step}} of {{steps}}</h1>
  <p class="board-note" data-test="lifecycle">{{log}}</p>
  <p class="board-note" data-test="speed">Speed {{speed}}</p>
  <div class="board-row">
    <x-import component-from-global-scope="Fixture.Button" on-click="{{restart}}" data-test="restart">Start again</x-import>
    <x-import component-from-global-scope="Fixture.Button" variant="secondary" on-click="{{advance}}" data-test="advance">Next step</x-import>
  </div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"speed":{"editor":"enum","options":["slow","fast"],"default":"slow"},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { step: 1, log: ['constructed'] };
  }
  componentDidMount() {
    this.note('mounted');
    this.timer = setInterval(() => {}, 60000);
  }
  componentDidUpdate(prevProps) {
    if (prevProps.speed !== this.props.speed) this.note('speed ' + this.props.speed);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  note(text) {
    this.setState((s) => ({ log: s.log.concat(text) }));
  }
  renderVals() {
    const steps = 3;
    return {
      theme: this.props.theme ?? 'light',
      speed: this.props.speed ?? 'slow',
      step: this.state.step,
      steps,
      log: this.state.log.join(', '),
      advance: () => this.setState((s) => ({ step: s.step >= steps ? 1 : s.step + 1 })),
      restart: () => this.setState({ step: 1 }, () => this.note('restarted')),
    };
  }
}
</script>
</body>
</html>
