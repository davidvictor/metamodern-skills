name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Canvas tooling and headless Chromium
        run: node metamodern-work-on-canvases/scripts/tooling.mjs install --browser --with-deps
      - run: npm test
        env:
          CANVAS_BROWSER_TESTS: required
      - run: npm run validate
